app = "cellcounter-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  ALLOWED_ORIGINS = "https://cellcounter-api.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "cellcounter_data"
  destination = "/data"
  initial_size = "10gb"
