[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellcounter"
version = "0.0.1"
description = "Local, non-commercial AI cell counting tool (napari + Cellpose/StarDist)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "stellakaval" }]

# Pins reflect the verified Apple Silicon install order (see env/environment.md).
# NumPy is ceilinged to avoid a 2.x/Keras/skimage resolution clash; install order
# in environment.md matters more than the pins alone.
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy",
    "pandas",
    "tifffile",
    "czifile",
    "scikit-image",
    "tensorflow>=2.20,<2.22",
    "csbdeep>=0.8",
    "stardist>=0.9.2",
    "cellpose>=4.2,<5",
    "napari[pyqt6]",
    "magicgui",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "httpx"]
# Web app backend (Phase 2). Optional so the napari install is unaffected.
web = [
    "fastapi",
    "uvicorn[standard]",
    "pillow",
    "openpyxl",
    "sqlmodel",
    "python-multipart",
]

[project.scripts]
cellcounter = "cellcounter.widget:main"

[project.entry-points."napari.manifest"]
cellcounter = "cellcounter:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cellcounter = ["napari.yaml"]
